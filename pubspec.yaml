name: foxbit
description: "A cypto project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  http: ^1.5.0
  dio: ^5.7.0
  xml: ^7.0.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  fl_chart: ^1.1.0
  skeletonizer: ^3.0.0
  hive_ce: ^2.12.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  flutter_native_splash: ^2.4.6
  go_router: ^18.0.2
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_logo.png
    - assets/icons/
    - assets/bitcoin.csv

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/sfpro/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/sfpro/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/sfpro/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/sfpro/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/sfpro/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: assets/fonts/sfpro/SF-Pro-Display-Black.otf
          weight: 900
        - asset: assets/fonts/sfpro/SF-Pro-Display-RegularItalic.otf
          style: italic
